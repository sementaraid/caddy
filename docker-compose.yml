services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    # Optional secrets for the Caddyfile (e.g. the signals.sunar.dev login). See .env.example.
    env_file:
      - path: ./.env
        required: false
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../_me:/srv/_me:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web

networks:
  web:
    external: true

volumes:
  caddy-data:
  caddy-config: